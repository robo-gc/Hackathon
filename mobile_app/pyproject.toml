[project]
name = "map-inclusive"
version = "0.2.0"
description = "Map Inclusive — App móvil accesible para Android hecha 100% en Python (Flet) + Google Gemini API"
requires-python = ">=3.11"
dependencies = [
    "flet==1.1.3",
    "flet-geolocator==1.1.3",
    "httpx>=0.27.0",
]

[tool.flet]
org = "com.apexsoa"
product = "Map Inclusive"
company = "Equipo Apex soa - Campus Coyoacán"

[tool.flet.app]
path = "."

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.VIBRATE" = true

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "Map Inclusive necesita tu ubicación actual para mostrarte rutas accesibles, clínicas y alertas cercanas."
NSLocationAlwaysAndWhenInUseUsageDescription = "Map Inclusive usa tu ubicación para rutas accesibles y alertas de seguridad."
NSPhotoLibraryUsageDescription = "Map Inclusive necesita acceso a tu fototeca para subir tu foto de perfil o verificación de voluntario."
NSCameraUsageDescription = "Map Inclusive necesita acceso a la cámara para tomar tu foto de rostro."

[tool.flet.macos.info]
NSLocationWhenInUseUsageDescription = "Map Inclusive necesita tu ubicación actual para mostrarte rutas accesibles, clínicas y alertas cercanas."
NSLocationUsageDescription = "Map Inclusive usa tu ubicación para rutas accesibles, clínicas cercanas y alertas de seguridad."
NSPhotoLibraryUsageDescription = "Map Inclusive necesita acceso a tus fotos para subir tu imagen de perfil o verificación de voluntario."
NSCameraUsageDescription = "Map Inclusive necesita acceso a la cámara para tomar tu foto de rostro."

[tool.flet.macos.entitlement]
"com.apple.security.network.client" = true
"com.apple.security.personal-information.location" = true
"com.apple.security.files.user-selected.read-only" = true
"com.apple.security.assets.pictures.read-only" = true
